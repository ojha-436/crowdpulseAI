steps:
  # Build the container
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/promptwar-501405/crowdpulse-ai:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/promptwar-501405/crowdpulse-ai:latest'
      - '.'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/promptwar-501405/crowdpulse-ai:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/promptwar-501405/crowdpulse-ai:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'crowdpulse-ai'
      - '--image'
      - 'gcr.io/promptwar-501405/crowdpulse-ai:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--set-env-vars'
      - 'GEMINI_API_KEY=${_GEMINI_API_KEY},GOOGLE_CLOUD_PROJECT=promptwar-501405'

substitutions:
  _GEMINI_API_KEY: ''

images:
  - 'gcr.io/promptwar-501405/crowdpulse-ai:$COMMIT_SHA'
  - 'gcr.io/promptwar-501405/crowdpulse-ai:latest'
